<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Aura Favicon</title>
  <desc id="desc">Neon orbital A icon for Aura voice assistant.</desc>

  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#123764" />
      <stop offset="55%" stop-color="#0a1d38" />
      <stop offset="100%" stop-color="#050b16" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42f5e6" />
      <stop offset="100%" stop-color="#6ea7ff" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)" stroke="#1a3b62" stroke-width="2" />

  <ellipse cx="32" cy="32" rx="22" ry="14" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9" />
  <ellipse cx="32" cy="32" rx="14" ry="22" fill="none" stroke="url(#accent)" stroke-width="1.7" opacity="0.45" />

  <path d="M32 15L20 47H25L28.2 38H35.8L39 47H44L32 15ZM29.8 33L32 26.6L34.2 33H29.8Z"
        fill="url(#accent)"
        filter="url(#glow)" />

  <circle cx="47" cy="20" r="3" fill="#42f5e6" filter="url(#glow)" />
</svg>
